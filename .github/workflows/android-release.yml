name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (vX.Y.Z or vX.Y.Z-beta.N)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-android:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      M8_KEYSTORE_BASE64: ${{ secrets.M8_ANDROID_KEYSTORE_BASE64 }}
      M8_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.M8_ANDROID_KEYSTORE_PASSWORD }}
      M8_RELEASE_KEY_ALIAS: ${{ secrets.M8_ANDROID_KEY_ALIAS }}
      M8_RELEASE_KEY_PASSWORD: ${{ secrets.M8_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            git checkout --detach "${tag}"
          fi

          if [[ "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            channel=stable
            prerelease_number=99
            version_name="${tag#v}"
            alias_name=M8droid-latest.apk
            title="M8droid ${tag#v}"
          elif [[ "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]]; then
            channel=beta
            prerelease_number="${BASH_REMATCH[4]}"
            if (( prerelease_number < 1 || prerelease_number > 98 )); then
              echo "Beta number must be between 1 and 98" >&2
              exit 1
            fi
            version_name="${tag#v}"
            alias_name=M8droid-beta.apk
            title="M8droid ${tag#v}"
          else
            echo "Unsupported release tag: ${tag}" >&2
            echo "Use vX.Y.Z for stable or vX.Y.Z-beta.N for beta." >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          version_code=$((major * 1000000 + minor * 10000 + patch * 100 + prerelease_number))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Computed Android versionCode is outside the supported range: ${version_code}" >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${release_sha}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "M8_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "M8_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "APK_ALIAS=${alias_name}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${title}" >> "$GITHUB_ENV"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use runner JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          for value in M8_KEYSTORE_BASE64 M8_RELEASE_KEYSTORE_PASSWORD M8_RELEASE_KEY_ALIAS M8_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required GitHub Actions secret is missing: ${value}" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/m8droid-release.jks"
          printf '%s' "$M8_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "M8_RELEASE_KEYSTORE_PATH=${keystore}" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        run: >-
          ./gradlew
          testDebugUnitTest
          lintRelease
          assembleRelease
          -PM8_VERSION_NAME="$M8_VERSION_NAME"
          -PM8_VERSION_CODE="$M8_VERSION_CODE"
          --no-daemon

      - name: Verify and stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

          mkdir -p dist
          versioned="M8droid-${RELEASE_TAG}.apk"
          install -m 0644 "$apk" "dist/${versioned}"
          install -m 0644 "$apk" "dist/${APK_ALIAS}"
          (
            cd dist
            sha256sum "$versioned" > "${versioned}.sha256"
            sha256sum "$APK_ALIAS" > "${APK_ALIAS}.sha256"
          )

          cat > dist/release-notes.md <<EOF
          ## ${RELEASE_TITLE}

          Signed Android APK from commit \`${RELEASE_SHA}\`.

          This is an unofficial, community-built M8-style tracker. It is not affiliated with, authorized, or endorsed by Dirtywave. It does not run Dirtywave firmware or reproduce the exact M8 DSP engine. Imported \`.m8s\` songs use Android-native sound approximation, and projects save as \`.m8droid\`.

          - Channel: **${RELEASE_CHANNEL}**
          - Android version: \`${M8_VERSION_NAME}\` (code \`${M8_VERSION_CODE}\`)
          - Minimum Android: 8.0 (API 26)
          - Full compatibility notes: [M8_DIFFERENCES.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/M8_DIFFERENCES.md)
          EOF

      - name: Publish versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/M8droid-${RELEASE_TAG}.apk"
            "dist/M8droid-${RELEASE_TAG}.apk.sha256"
            "dist/${APK_ALIAS}"
            "dist/${APK_ALIAS}.sha256"
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$RELEASE_CHANNEL" == stable ]]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file dist/release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ "$RELEASE_CHANNEL" == stable ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TITLE" --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TITLE" --notes-file dist/release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update rolling beta release
        if: env.RELEASE_CHANNEL == 'beta'
        shell: bash
        run: |
          set -euo pipefail
          gh release delete beta --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/beta" >/dev/null 2>&1 || true
          gh release create beta \
            "dist/M8droid-beta.apk" \
            "dist/M8droid-beta.apk.sha256" \
            --target "$RELEASE_SHA" \
            --title "M8droid Beta" \
            --notes "Rolling beta channel. Current build: ${RELEASE_TAG}. See the versioned release for full notes." \
            --prerelease \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: M8droid-${{ steps.metadata.outputs.channel }}-${{ steps.metadata.outputs.version_name }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
